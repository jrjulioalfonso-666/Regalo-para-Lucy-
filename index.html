
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumpleaños 🎉</title>

<style>
/* ===== Estilos generales ===== */
body{
  margin:0;
  padding:0;
  background: url("pantalla.jpg") no-repeat center center fixed;
  background-size: cover;
  font-family: 'Arial', sans-serif;
  color:white;
  text-align:center;
  overflow-x:hidden;
}

/* ===== Corazón animado ===== */
#heartBtn{
  position:relative;
  width:100px;
  height:90px;
  margin:150px auto;
  cursor:pointer;
  animation: latido 1.2s infinite;
}

#heartBtn:before,
#heartBtn:after{
  content:"";
  position:absolute;
  left:50px;
  top:0;
  width:50px;
  height:75px;
  background:red;
  border-radius:50px 50px 0 0;
  transform:rotate(-45deg);
  transform-origin:0 100%;
}

#heartBtn:after{
  left:0;
  transform:rotate(45deg);
  transform-origin:100% 100%;
}

@keyframes latido{
  0%{transform:scale(1);}
  50%{transform:scale(1.15);}
  100%{transform:scale(1);}
}

/* ===== Contenedor principal ===== */
#contenido{
  display:none;
  margin-top:20px;
  padding:0 10px;
}

#imagen{
  width:80%;
  max-width:300px;
  margin-bottom:20px;
  transition: transform 1s;
  border-radius:15px;
}

#texto{
  width:100%;
  font-size:18px;
  min-height:120px;
  text-shadow:0 0 8px black;
  margin:auto;
}

/* ===== Botón ===== */
#btnSiguiente{
  padding:10px 20px;
  font-size:16px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background: pink;
  color: white;
  box-shadow: 0 0 10px pink;
  transition: transform 0.2s;
  display:none;
  margin-top:15px;
}

#btnSiguiente:hover{
  transform: scale(1.1);
}

/* ===== Efectos mágicos ===== */
.magia{
  animation: brillo 1s infinite alternate;
}

@keyframes brillo{
  from{ text-shadow: 0 0 10px gold;}
  to{ text-shadow: 0 0 25px white;}
}

/* ===== Destellos y partículas ===== */
#particulas{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  overflow:hidden;
  z-index:10;
}

.particula{
  position:absolute;
  width:8px;
  height:8px;
  background: gold;
  border-radius:50%;
  opacity:0.8;
  animation: caer linear infinite;
}

@keyframes caer{
  0%{transform: translateY(0) translateX(0);}
  100%{transform: translateY(100vh) translateX(30px);}
}

/* ===== Carta final con marco ===== */
#sobreFinal{
  display:none;
  margin-top:30px;
  animation: aparecer 2s forwards;
  position: relative;
  padding:0 10px;
}

@keyframes aparecer{
  from{opacity:0; transform:scale(0);}
  to{opacity:1; transform:scale(1);}
}

#carta{
  background: rgba(255,255,255,0.95);
  color: #333;
  width: 100%;
  max-width: 550px;
  margin: 0 auto;
  padding: 30px;
  border-radius: 20px;
  border: 4px dashed #ff69b4;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
  text-align: center;
  position: relative;
  overflow: hidden;
}

/* Imágenes dentro de la carta */
.imagenesCarta{
  display: flex;
  flex-wrap: wrap;
  justify-content: space-around;
  margin-top: 15px;
}

.imagenesCarta img{
  width:70px;
  height:70px;
  margin:5px;
  border-radius: 10px;
  box-shadow: 0 0 8px rgba(0,0,0,0.3);
  transition: transform 0.3s;
}

.imagenesCarta img:hover{
  transform: scale(1.2) rotate(5deg);
}

/* Globos flotantes */
.globo{
  position: absolute;
  width: 40px;
  height: 60px;
  background: radial-gradient(circle at 30% 30%, #ff5f5f, #ff0000);
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  animation: flotar linear infinite;
}

@keyframes flotar{
  0%{transform: translateY(100vh) translateX(0);}
  100%{transform: translateY(-100px) translateX(30px);}
}

/* ===== Ajustes para móviles ===== */
@media (max-width:480px){
  #texto{
    font-size:16px;
  }
  #btnSiguiente{
    font-size:14px;
    padding:8px 16px;
  }
  #carta{
    padding:20px;
  }
  .imagenesCarta img{
    width:60px;
    height:60px;
  }
  #imagen{
    width:90%;
  }
}
</style>
</head>
<body>

<!-- Música -->
<audio id="musica" loop>
  <source src="Frogtheme1.mp3" type="audio/mp3">
</audio>

<!-- Corazón inicial -->
<div id="heartBtn" onclick="iniciar()"></div>

<!-- Contenido principal -->
<div id="contenido">
  <div id="particulas"></div>
  <img id="imagen" src="Imagen1.png">
  <div id="texto"></div>
  <button id="btnSiguiente" onclick="siguiente()">Siguiente</button>
</div>

<!-- Carta final con marco y globos -->
<div id="sobreFinal">
  <div id="carta">
    <h1>💌 Tienes una carta muy especial...</h1>
    <p>Que tengas un cumpleaños lleno de magia y alegría ✨🎁</p>
    <div class="imagenesCarta">
      <img src="Imagen6.png" alt="Decoración 1">
      <img src="Imagen7.png" alt="Decoración 2">
      <img src="Imagen8.png" alt="Decoración 3">
    </div>
    <!-- Globos -->
    <div class="globo" style="left:5%; animation-duration: 8s;"></div>
    <div class="globo" style="left:25%; animation-duration: 10s;"></div>
    <div class="globo" style="left:50%; animation-duration: 9s;"></div>
    <div class="globo" style="left:70%; animation-duration: 12s;"></div>
    <div class="globo" style="left:90%; animation-duration: 11s;"></div>
  </div>
</div>

<script>
// Textos
let paso=0;
let textos=[
`Hola, señorita cumpleañera 🌸  
¿Cómo se siente cumplir 21 años? 🎉  

Yo ya no me acuerdo porque tengo 91 😅  

Pero... adivina quién sí sabe cómo celebrar 🎂💖`, 

`Una persona muy especial me contó que extraña mucho jugar contigo :'(\n  
Y me pidió decirte que sos fuerte, valiente y que siempre luchas por tus sueños 🌟💪`,

`Por si no sabías, soy un poderoso mago 🧙‍♂️✨  
Y estoy a punto de lanzar un hechizo especial para que tengas un cumpleaños mágico 🎁💫`
];

// Iniciar regalo
function iniciar(){
  document.getElementById("heartBtn").style.display="none";
  document.getElementById("contenido").style.display="block";
  document.getElementById("musica").play();
  escribirTexto(textos[0]);
}

// Siguiente texto
function siguiente(){
  paso++;
  if(paso < textos.length){
    document.getElementById("imagen").src="Imagen"+(paso+1)+".png";
    escribirTexto(textos[paso]);
    if(paso==2){
      activarMagia();
      cambiarMusica();
    }
  }else{
    mostrarCartaFinal();
  }
}

// Texto progresivo
function escribirTexto(texto){
  let i=0;
  let contenedor=document.getElementById("texto");
  let boton=document.getElementById("btnSiguiente");
  contenedor.innerHTML="";
  contenedor.classList.remove("magia");
  boton.style.display="none";

  let intervalo=setInterval(function(){
    contenedor.innerHTML += texto.charAt(i);
    i++;
    if(i >= texto.length){
      clearInterval(intervalo);
      boton.style.display = "inline-block";
    }
  },50);
}

// Efectos mágicos
function activarMagia(){
  document.getElementById("texto").classList.add("magia");
  crearParticulas(30);
}

// Crear partículas doradas
function crearParticulas(cantidad){
  const cont=document.getElementById("particulas");
  for(let i=0;i<cantidad;i++){
    let p=document.createElement("div");
    p.classList.add("particula");
    p.style.left=Math.random()*100+"%";
    p.style.width=Math.random()*10+5+"px";
    p.style.height=p.style.width;
    p.style.animationDuration=(Math.random()*3+2)+"s";
    cont.appendChild(p);
    setTimeout(()=>{p.remove()},5000);
  }
}

// Cambiar música
function cambiarMusica(){
  let musica=document.getElementById("musica");
  musica.src="Fanfare1.mp3";
  musica.play();
}

// Mostrar carta final
function mostrarCartaFinal(){
  document.getElementById("contenido").style.display="none";
  document.getElementById("sobreFinal").style.display="block";
}
</script>
</body>
</html>

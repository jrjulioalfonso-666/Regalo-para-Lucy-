<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumpleaños ✨</title>

<style>
body{
  margin:0;
  padding:0;
  background:url("pantalla.jpg") no-repeat center center fixed;
  background-size:cover;
  font-family:Arial, sans-serif;
  text-align:center;
  color:white;
  overflow-x:hidden;
}

/* CORAZÓN */
#heartBtn{
  width:100px;
  height:90px;
  margin:150px auto;
  position:relative;
  cursor:pointer;
  animation:latido 1.2s infinite;
}
#heartBtn:before,#heartBtn:after{
  content:"";
  position:absolute;
  width:50px;
  height:75px;
  background:red;
  border-radius:50px 50px 0 0;
}
#heartBtn:before{
  left:50px;
  transform:rotate(-45deg);
  transform-origin:0 100%;
}
#heartBtn:after{
  left:0;
  transform:rotate(45deg);
  transform-origin:100% 100%;
}
@keyframes latido{
  0%{transform:scale(1);}
  50%{transform:scale(1.15);}
  100%{transform:scale(1);}
}

/* CONTENIDO */
#contenido{display:none;padding:0 6%;}
#imagen{
  width:95%;
  max-width:340px;
  border-radius:15px;
  margin-top:20px;
}
#texto{
  margin-top:15px;
  font-size:18px;
  min-height:120px;
  text-shadow:0 0 10px black;
}
#btnSiguiente{
  margin-top:15px;
  padding:10px 20px;
  border:none;
  border-radius:12px;
  background:pink;
  color:white;
  display:none;
}

/* HECHIZO */
#circulo{
  position:fixed;
  width:250px;
  height:250px;
  border:3px solid gold;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:none;
  box-shadow:0 0 40px gold;
}
#circulo:before{
  content:"";
  position:absolute;
  width:200px;
  height:200px;
  border:2px dashed white;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}
.girar{
  animation:giro 4s linear infinite;
}
@keyframes giro{
  from{transform:translate(-50%,-50%) rotate(0);}
  to{transform:translate(-50%,-50%) rotate(360deg);}
}

/* símbolos orbitando */
.simbolo{
  position:absolute;
  font-size:20px;
  animation:orbitar 3s linear infinite;
}
@keyframes orbitar{
  from{transform:rotate(0deg) translateX(120px) rotate(0deg);}
  to{transform:rotate(360deg) translateX(120px) rotate(-360deg);}
}

/* FUEGOS */
.particula{
  position:fixed;
  width:6px;
  height:6px;
  border-radius:50%;
  background:gold;
  pointer-events:none;
  animation:explosion 1s forwards;
}
@keyframes explosion{
  from{opacity:1;transform:translate(0,0);}
  to{opacity:0;transform:translate(var(--x),var(--y));}
}

/* SOBRE */
#sobre{
  display:none;
  margin:40px auto;
  width:300px;
  height:200px;
  position:relative;
  perspective:1000px;
}
#tapa{
  position:absolute;
  width:100%;
  height:100%;
  background:#ff69b4;
  transform-origin:top;
  transition:transform 1.5s;
}
#carta{
  position:absolute;
  width:100%;
  height:100%;
  background:white;
  color:#333;
  padding:20px;
  box-sizing:border-box;
  transform:translateY(100%);
  transition:transform 1.5s;
  overflow:auto;
}
.abrir #tapa{
  transform:rotateX(-180deg);
}
.abrir #carta{
  transform:translateY(0);
}

/* NOMBRE DORADO */
.nombre{
  font-size:22px;
  font-weight:bold;
  background:linear-gradient(90deg,gold,white,gold);
  background-size:200%;
  -webkit-background-clip:text;
  color:transparent;
  animation:brilloNombre 3s linear infinite;
}
@keyframes brilloNombre{
  from{background-position:0%;}
  to{background-position:200%;}
}

@media(max-width:480px){
  #texto{font-size:16px;}
  #sobre{width:260px;height:180px;}
}
</style>
</head>
<body>

<audio id="musica" loop>
<source src="Frogtheme1.mp3" type="audio/mp3">
</audio>

<audio id="hechizoSonido">
<source src="Fanfare1.mp3" type="audio/mp3">
</audio>

<div id="heartBtn" onclick="iniciar()"></div>

<div id="contenido">
  <img id="imagen" src="Imagen1.png">
  <div id="texto"></div>
  <button id="btnSiguiente" onclick="siguiente()">Siguiente</button>
</div>

<div id="circulo"></div>

<div id="sobre">
  <div id="tapa"></div>
  <div id="carta">
    <p class="nombre">Lukya 💖</p>
    <p>Hoy cumple años la persona más importante de mi vida.</p>
    <p>Mi amiga, mi confidente, mi todo.</p>
    <p>Gracias por existir ✨</p>
  </div>
</div>

<script>
let paso=0;

let textos=[
"Hola señorita cumpleañera 🌸",
"Eres fuerte, brillante y maravillosa ✨",
"Soy un poderoso mago 🧙‍♂️",
"Y ahora... activaré el hechizo supremo 🔮"
];

function iniciar(){
document.getElementById("heartBtn").style.display="none";
document.getElementById("contenido").style.display="block";
document.getElementById("musica").play();
escribir(textos[0]);
}

function siguiente(){
paso++;
if(paso<textos.length){
document.getElementById("imagen").src="Imagen"+(paso+1)+".png";
escribir(textos[paso]);
if(paso==2){activarHechizo();}
}else{
mostrarCarta();
}
}

function escribir(t){
let i=0;
let cont=document.getElementById("texto");
let btn=document.getElementById("btnSiguiente");
cont.innerHTML="";
btn.style.display="none";
let inter=setInterval(()=>{
cont.innerHTML+=t.charAt(i);
i++;
if(i>=t.length){
clearInterval(inter);
btn.style.display="inline-block";
}
},40);
}

function activarHechizo(){
let circulo=document.getElementById("circulo");
circulo.style.display="block";
circulo.classList.add("girar");

document.getElementById("musica").pause();
document.getElementById("hechizoSonido").play();

for(let i=0;i<25;i++){
let p=document.createElement("div");
p.className="particula";
p.style.left="50%";
p.style.top="50%";
p.style.setProperty("--x",(Math.random()*300-150)+"px");
p.style.setProperty("--y",(Math.random()*300-150)+"px");
document.body.appendChild(p);
setTimeout(()=>p.remove(),1000);
}

setTimeout(()=>{
circulo.style.display="none";
},3000);
}

function mostrarCarta(){
document.getElementById("contenido").style.display="none";
let sobre=document.getElementById("sobre");
sobre.style.display="block";
setTimeout(()=>sobre.classList.add("abrir"),500);
}
</script>

</body>
</html>
